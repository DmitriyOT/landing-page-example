name: Deploy Dell Landing Page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1"

jobs:
  # ─── LINT & TYPE CHECK ───
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # ─── BUILD ───
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/standalone
          retention-days: 7

  # ─── Lighthouse Performance Audit ───
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          budgetPath: ./budget.json

  # ─── DEPLOY (on main push only) ───
  deploy:
    name: Deploy to Production
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/standalone

      - name: Deploy
        run: |
          echo "Deploy step — replace with your deployment provider"
          echo "Examples: Vercel, AWS Amplify, Docker, DigitalOcean App Platform"
          # Uncomment for Vercel:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # Uncomment for Docker:
          # docker build -t dell-landing .
          # docker push ${{ secrets.DOCKER_REGISTRY }}/dell-landing:latest
